# Board profile: Radxa Zero 3W (RK3566). Shell-sourceable KEY=value, no commands.
# Every value mirrors a constant currently hard-coded in gs/*.sh (src: file:line).
# Nothing sources this file yet (milestone M2: contract only, zero behaviour change).

BOARD_ID='radxa-zero3'

# GPIO pins are resolved by name as "PIN_<n>" via gpiofind
# src: gs/button.sh:51, gs/button.sh:193, gs/gs.sh:127, gs/stream.sh:76
GPIO_PIN_PREFIX='PIN_'

# USB OTG controller and its debugfs role switch
# src: gs/otg-gadget.sh:4, gs/button.sh:52
OTG_MODE_FILE='/sys/kernel/debug/usb/fcc00000.dwc3/mode'

# Device tree overlays directory and SoC overlay file prefix
# src: gs/gs-applyconf.sh:65, gs/gs-applyconf.sh:92
DTBO_DIR='/boot/dtbo'
DTBO_SOC_PREFIX='rk3568-'
# Same directory as seen from the lower (read-only root) layer during init
# src: gs/gs-init.sh:50
DTBO_DIR_LOWER='/media/root-ro/boot/dtbo'

# Onboard wifi interface name
# src: gs/button.sh:15, gs/gs.sh:92, gs/gs-applyconf.sh:78
WIFI_ONBOARD_IFACE='wifi0'

# Home directory of the default user (ruby runtime)
# src: gs/gs.sh:57
HOME_DIR='/home/radxa'

# Serial console of the board
# src: gs/gs-init.sh:10
CONSOLE_TTY='/dev/ttyFIQ0'

# PWM fan: sysfs path pattern (chip number comes from gs.conf fan_pwm_chip)
# src: gs/fan.sh:5
PWM_SYSFS_BASE='/sys/class/pwm/pwmchip'

# Disk layout: partition suffix style ("p" => ${dev}p5), overlay and videos partition numbers, videos label
# src: gs/gs-init.sh:26 (p5), gs/gs-init.sh:31,34 (partition 4 / p4), gs/gs-init.sh:36-37 (label videos)
PART_SEP='p'
PART_OVERLAY_NUM='4'
PART_VIDEOS_NUM='5'
PART_VIDEOS_LABEL='videos'
# Root device is found by the filesystem label "rootfs"
# src: gs/gs-init.sh:25
ROOTFS_LABEL='rootfs'

# Mass-storage backing device for the OTG gadget: SD/eMMC candidates in order of preference
# src: gs/otg-gadget.sh:41-42
OTG_MASS_STORAGE_DEFAULT='/dev/mmcblk0p4'
OTG_MASS_STORAGE_ALT='/dev/mmcblk1p4'
