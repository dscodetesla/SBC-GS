# Board profile: Raspberry Pi 5 (BCM2712 + RP1 south bridge) on Raspberry Pi OS Bookworm 64-bit, kernel 6.12 (flavour rpi-2712, 16K pages). DRAFT.
# Shell-sourceable KEY=value, no commands. Nothing sources this file for Pi yet; no image was built, nothing ran on hardware.
# OS base decision: Bookworm (owner, docs/DECISIONS.md R4, docs/PI-PORT.md section 12). Kernel 6.12 = raspberrypi/linux branch rpi-6.12.y.
# Every key carries an evidence comment: "# src:" (what was read, quoted) and, where the value is not proven, "# UNVERIFIED (reason)".
# Evidence tags: SRC = read from the primary source (fetched 2026-10-03 from raw.githubusercontent.com), REPO = file:line in this repo, INF = inference, HW = needs hardware.
# Abbreviations: linux = raspberrypi/linux@rpi-6.12.y (dts in arch/arm64/boot/dts/broadcom/), docs = raspberrypi/documentation@master documentation/asciidoc/computers,
# firmware = raspberrypi/firmware@master, pi-gen = RPi-Distro/pi-gen@bookworm (the branch that builds Bookworm images).
# www.raspberrypi.com (HTML) returns 403 through the proxy, so the .adoc sources on raw.githubusercontent.com were used instead.
# Docs: docs/BOARD-RPI5.md (key table, UNVERIFIED list, first-boot checklist). Static check: tests/static/rpi5-draft.sh (ratchet on UNVERIFIED markers).

# src: REPO gs/boards/REQUIRED_KEYS:2 (BOARD_ID is the directory name)
BOARD_ID='rpi5'

# GPIO line lookup name prefix, used as: gpiofind ${GPIO_PIN_PREFIX}<n>
# src: SRC linux bcm2712-rpi-5-b.dts:633-662 "&rp1_gpio { gpio-line-names = "ID_SDA", // GPIO0 "ID_SCL", // GPIO1 "GPIO2", // GPIO2 ... "GPIO27", // GPIO27" (the 40-pin header lines sit on the RP1 chip and are named GPIO<BCM>, as on Pi 4)
# src: SRC linux drivers/pinctrl/pinctrl-rp1.c:39,790 MODULE_NAME "pinctrl-rp1" is the gpio_chip label (see GPIO_CHIP_LABEL); gpiofind (libgpiod v1.6.3) matches line NAMES over all chips and prints "<chip> <offset>"
# src: SRC gpiozero pins/data.py:530 "PI5_J8 = PI4_J8 # This is slightly wrong, but see the PI5_GPIO comment above" (pinmap.conf is this table); SRC docs gpio-on-raspberry-pi.adoc:4 "40-pin GPIO ... on all current Raspberry Pi boards"
# UNVERIFIED (header pin -> GPIO table is third-party gpiozero (author's own caveat for Pi 5, pinmap.conf) and the line names are read from the dts, not from gpioinfo on a real Pi 5 (HW); gs.conf pin values reach gpio_find only after the M3c wiring)
GPIO_PIN_PREFIX='GPIO'

# Optional contract extensions (docs/BOARD-RPI4.md section 4, library level in gs/lib/gpio.sh and gs/lib/hw.sh; no script calls them yet).
# GPIO_PIN_NUMBERING: how <n> in gpio_find <n> is read. 'physical' = header pin number (gs.conf pin values, Radxa contract)
# src: REPO gs/lib/gpio.sh gpio_find; SRC docs gpio-on-raspberry-pi.adoc:14 "GPIO pins 0 and 1 are present on the board (physical pins 27 and 28)" (physical pin and GPIO number differ)
GPIO_PIN_NUMBERING='physical'
# GPIO_PIN_MAP: physical pin -> GPIO table (file relative to this board directory), so gpio_find 7 -> gpiofind GPIO4. Pins 27/28 are labels (ID_SDA/ID_SCL): gpio_find refuses them (no line GPIO0/GPIO1 exists)
# src: SRC gpiozero pins/data.py:499-530 PI4_J8 / PI5_J8 (see pinmap.conf); SRC linux bcm2712-rpi-5-b.dts:635-636 lines 0/1 are "ID_SDA"/"ID_SCL", not "GPIO0"/"GPIO1"
GPIO_PIN_MAP='pinmap.conf'
# GPIO chip label for finding the RP1 chip at runtime (gpiodetect prints "gpiochipN [pinctrl-rp1] (54 lines)"); the chip NUMBER must not be hard-coded, gpiofind prints it
# src: SRC linux drivers/pinctrl/pinctrl-rp1.c:39 '#define MODULE_NAME "pinctrl-rp1"', :790 '.label = MODULE_NAME', :40 'RP1_NUM_GPIOS 54'; the number is gpiochip0 or gpiochip4 depending on the kernel (docs/BOARD-RPI5.md section 3, HW)
GPIO_CHIP_LABEL='pinctrl-rp1'

# USB OTG controller. 'none' = this profile has no runtime host/device role switch (sentinel, see gs/lib/otg.sh otg_supported)
# src: SRC linux rp1.dtsi:1118-1121,1135-1138 rp1_usb0/rp1_usb1 "compatible = "snps,dwc3"; dr_mode = "host";" (the two RP1 USB controllers behind the four USB-A ports are host-only)
# src: SRC linux drivers/usb/dwc3/debugfs.c:450-451 "if (dwc->dr_mode != USB_DR_MODE_OTG) return count;" (a write to the dwc3 debugfs "mode" file is silently ignored when dr_mode is not otg)
# src: SRC linux drivers/usb/dwc2/debugfs.c:783-785 only "params", "hw_params", "dr_mode" (0444); bcm2712-ds.dtsi:359-362 the SoC dwc2 node "usb@480000" is status = "disabled" (needs dtoverlay=dwc2, static choice at boot); whether it reaches the USB-C connector is HW
OTG_CONTROLLER='none'
# src: same as OTG_CONTROLLER; gs/button.sh change_otg_mode and gs/otg-gadget.sh must be skipped when OTG_CONTROLLER is 'none' (button.sh does, see docs/BOARD-RPI5.md section 5)
OTG_MODE_FILE='none'

# Directory of device tree overlay files. On Pi they are only AVAILABLE here; they are enabled by a dtoverlay= line in config.txt, not by renaming files
# src: SRC docs config_txt/what_is_config_txt.adoc:3 "Raspberry Pi OS looks for this file in the *boot partition*, located at `/boot/firmware/`."
# src: SRC firmware boot/overlays/README "Load:   dtoverlay=dwc2,<param>=<val>" (activation is a config.txt line); INF the on-disk name overlays/ under /boot/firmware follows the firmware repo layout boot/overlays/
DTBO_DIR='/boot/firmware/overlays'
# DTBO_MODE: how overlays are enabled. 'rename' (Radxa: *.dtbo.disabled <-> *.dtbo) or 'config-txt' (a dtoverlay= line in CONFIG_TXT); read by hw_dtbo_mode, not acted on yet
# src: SRC firmware boot/overlays/README "Load:   dtoverlay=dwc2,<param>=<val>" (activation is a config.txt line, files are not renamed)
DTBO_MODE='config-txt'
# Radxa overlay files are named <soc>-<name>.dtbo (rk3568-...). Pi overlays have no SoC prefix; 'none' = sentinel
# src: SRC firmware boot/overlays/README "dtoverlay=i2c-rtc", "dtoverlay=pwm-fan", "dtoverlay=dwc2" (names without a SoC prefix)
# src: REPO gs/gs-applyconf.sh:65,92 (Radxa: ls /boot/dtbo/rk3568-*.dtbo and mv of .dtbo.disabled; needs the config.txt mechanism instead, see docs/BOARD-RPI4.md section 4.3)
DTBO_SOC_PREFIX='none'
# DTBO_DIR_LOWER (overlay directory seen from the lower layer of overlayroot) is deliberately NOT defined: optional key, nothing reads it (gs-init.sh:50 keeps the Radxa literal), value unknown until an overlayroot image exists (docs/BOARD-RPI5.md section 7)

# Onboard wifi interface name. The profile keeps the Radxa convention (onboard = wifi0) so that wlan0 stays free for the external RTL adapter
# src: REPO gs/98-rename.rules.in:2-4 (rule 1: every wl* -> wlan0; rule 2: the onboard driver -> @WIFI_ONBOARD_IFACE@; gs.sh:92 and button.sh:15 use wifi0)
# src: INF choosing wifi0 on Pi is a design decision for parity with scripts (same as rpi4); that udev renames the onboard device on Pi 5 is HW
WIFI_ONBOARD_IFACE='wifi0'
# Kernel driver of the onboard wifi (udev matches ENV{ID_NET_DRIVER})
# src: SRC linux bcm2712-rpi-5-b.dts:424-440 "&sdio2 { ... wifi: wifi@1 { compatible = "brcm,bcm4329-fmac";" (/* SDIO2 drives the WLAN interface */)
# src: SRC linux drivers/net/wireless/broadcom/brcm80211/brcmfmac/of.c:116 of_device_is_compatible(np, "brcm,bcm4329-fmac") (driver brcmfmac); bcm2712_defconfig:635 CONFIG_BRCMFMAC=m; ID_NET_DRIVER at ACTION==add is not observed (HW)
WIFI_ONBOARD_DRIVER='brcmfmac'

# Interface name of the USB gadget NIC (udev renames KERNELS=="gadget" to it). Unused while OTG_CONTROLLER is 'none'
# src: REPO gs/boards/rpi4/board.conf GADGET_IFNAME='rpi0' (same name, a design choice not a fact about Pi 5; gs/98-rename.rules.in:7 Radxa: radxa0); never matched while no gadget exists
GADGET_IFNAME='rpi0'

# Home directory of the default user (ruby runtime). The image builder creates the user, so this is a build decision
# src: SRC pi-gen README.md:170 "`FIRST_USER_NAME` (Default: `pi`)"
# src: REPO gs/gs.sh:57 (Radxa: /home/radxa); INF /home/pi follows the pi-gen default, the real user is chosen by the future image build
HOME_DIR='/home/pi'

# Serial console of the board (gs-init.sh writes the welcome banner to it). On Pi 5 the primary UART is the dedicated debug connector UART10
# src: SRC docs configuration/interfaces.adoc:276-277 "Raspberry Pi 5 | `UART10`" (primary, Linux console) and :300-306 "`/dev/ttyAMA10` ... Debug UART on Raspberry Pi 5", "`/dev/serial0` ... points to `/dev/ttyS0`, `/dev/ttyAMA0`, or `/dev/ttyAMA10` (Raspberry Pi 5)"
# src: SRC linux bcm2712-rpi-5-b.dts:187-189 "&uart10 { status = "okay"; };", bcm2712-rpi.dtsi:124,149 "console = &uart10;" "serial10 = &uart10;"; REPO gs/gs-init.sh:10 (Radxa: tee /dev/ttyFIQ0 /dev/tty1); /dev/ttyAMA10 is used directly, not the /dev/serial0 link
CONSOLE_TTY='/dev/ttyAMA10'

# PWM sysfs path pattern (chip number comes from gs.conf fan_pwm_chip). NOTE: the official Pi 5 fan is NOT a free PWM channel: the kernel pwm-fan driver owns RP1 PWM1 channel 3 (do not run gs/fan.sh for it)
# src: SRC linux Documentation/ABI/testing/sysfs-class-pwm:10 "What: /sys/class/pwm/pwmchip<N>/"; bcm2712_defconfig:1599 CONFIG_PWM_RP1=y; rp1.dtsi:397-415 rp1_pwm0/rp1_pwm1 "raspberrypi,rp1-pwm" (status = "disabled")
# src: SRC linux bcm2712-rpi-5-b.dts:390-398 "fan: cooling_fan { compatible = "pwm-fan"; ... pwms = <&rp1_pwm1 3 41566 PWM_POLARITY_INVERTED>;" and :492-494 "&rp1_pwm1 { status = "disabled"; pinctrl-0 = <&rp1_pwm1_gpio45>;" (GPIO45 FAN_PWM); SRC docs frequency-management.adoc:62,89 the firmware manages official fans and enables cooling_fan at boot
PWM_SYSFS_BASE='/sys/class/pwm/pwmchip'
# the official Pi 5 fan is driven by the kernel pwm-fan driver (see above): gs.sh must not start gs/fan.sh
# src: SRC linux bcm2712-rpi-5-b.dts:390-398 cooling_fan compatible "pwm-fan"
FAN_KERNEL_MANAGED='yes'

# Disk layout. Pi OS images use an MBR (msdos) table, not GPT, so there is no p3/p4/p5 GPT scheme
# src: SRC pi-gen export-image/prerun.sh:31,49-50 "parted --script "${IMG_FILE}" mklabel msdos" + "BOOT_DEV="${LOOP_DEV}p1"" + "ROOT_DEV="${LOOP_DEV}p2"" (an SD card is mmcblk0, partition suffix "p")
# src: SRC docs configuration/boot-behaviour.adoc:186 "`root=/dev/mmcblk0p2` means multimedia card block-device 0, partition 2" (mmcblk + p + N); an NVMe root would be nvme0n1p<N> (same "p")
PART_SEP='p'
# PART_TABLE: partition table type, 'gpt' (Radxa) or 'mbr'; read by hw_part_table, gs-init.sh does not act on it yet
# src: SRC pi-gen export-image/prerun.sh:31 "parted --script "${IMG_FILE}" mklabel msdos" (MBR)
PART_TABLE='mbr'
# Overlay (overlayroot upper) partition number. MBR allows 4 primaries: p1 boot, p2 root, p3 overlay, p4 extended container
# src: REPO docs/PI-PORT.md:34 "Pi OS — MBR (`p1` boot, `p2` root)" and docs/ROADMAP-EXECUTION.md:80 "MBR має лише 4 первинні, потрібен логічний розділ або монтування за міткою"
# UNVERIFIED (design for the M6 spike: no image with this layout was built, overlayroot on Pi OS is untested)
PART_OVERLAY_NUM='3'
# Recording partition number: first logical partition inside the extended p4 (Linux numbers logical partitions from 5)
# src: REPO gs/gs-init.sh:26,31,34 (Radxa: p5 videos, exfat); INF logical numbering starts at 5 (MBR rule), not read from a source this session
# UNVERIFIED (design for the M6 spike: gs-init.sh parted mkpart videos has no logical/extended handling, untested)
PART_VIDEOS_NUM='5'
# src: REPO gs/gs-init.sh:36-37 (mkfs.exfat -L videos)
PART_VIDEOS_LABEL='videos'
# Root device is found by the filesystem label "rootfs"
# src: SRC pi-gen export-image/prerun.sh:66 "mkfs.ext4 -L rootfs -O "$ROOT_FEATURES" "$ROOT_DEV"" (boot partition: :65 "mkdosfs -n bootfs")
ROOTFS_LABEL='rootfs'

# Mass-storage backing device for the OTG gadget. 'none' = no gadget on this profile (sentinel)
# src: same as OTG_CONTROLLER; REPO gs/otg-gadget.sh:41-42 (Radxa: /dev/mmcblk0p4, /dev/mmcblk1p4)
OTG_MASS_STORAGE_DEFAULT='none'
# src: same as OTG_MASS_STORAGE_DEFAULT (REPO gs/otg-gadget.sh:41-42, Radxa: /dev/mmcblk1p4)
OTG_MASS_STORAGE_ALT='none'

# CPU temperature file (millidegrees), read by the fan controller and the OLED status screen
# src: SRC linux bcm2712-ds.dtsi:48-53,275-277 "thermal-zones { cpu_thermal: cpu-thermal { ... thermal-sensors = <&thermal>;" and "thermal: thermal { compatible = "brcm,bcm2711-thermal";" (one SoC sensor); path format: SRC linux Documentation/driver-api/thermal/sysfs-api.rst "/sys/class/thermal/thermal_zone[0-*]:"
# UNVERIFIED (HW: the zone index 0 is not read from a source; check `cat /sys/class/thermal/thermal_zone*/type` = cpu-thermal)
THERMAL_CPU_TEMP_FILE='/sys/class/thermal/thermal_zone0/temp'

# I2C bus number of the external DS3231 RTC (optional key). On Pi 5: dtparam=i2c_arm=on (or i2c=on) enables RP1 i2c1 on GPIO2/3 (header pins 3/5), dtoverlay=i2c-rtc,ds3231
# src: SRC linux bcm2712-rpi.dtsi:138 "i2c1 = &i2c1;" and :379 "i2c1: &rp1_i2c1 { };", :427-428 "i2c1_pins: &rp1_i2c1_2_3 {}; i2c_arm: &i2c1 {" (rp1.dtsi:713-715 pins "gpio2", "gpio3"); :207-208 dtparam i2c / i2c_arm
# src: SRC linux drivers/i2c/i2c-core-base.c:1664-1667 "id = of_alias_get_id(dev->of_node, "i2c"); if (id >= 0) { adapter->nr = id;" (the alias fixes the bus number: /dev/i2c-1); SRC firmware boot/overlays/README "Name:   i2c-rtc ... ds3231  Select the DS3231 device"
RTC_I2C_BUS='1'

# Pi-specific optional keys (not in the Radxa profile; nothing reads them yet)
# src: SRC docs config_txt/what_is_config_txt.adoc:3 "boot partition, located at `/boot/firmware/`"
BOOT_FIRMWARE_DIR='/boot/firmware'
# src: SRC docs config_txt/what_is_config_txt.adoc:3 "Instead of the BIOS ... Raspberry Pi devices use a configuration file called `config.txt`."
CONFIG_TXT='/boot/firmware/config.txt'
# src: SRC docs config_txt/boot.adoc:18 "`cmdline` is the alternative filename on the boot partition from which to read the kernel command line string; the default value is `cmdline.txt`."
CMDLINE_TXT='/boot/firmware/cmdline.txt'

# prefix of /proc/device-tree/model (the firmware appends the revision, e.g. "... Model B Rev 1.0"): board autodetection in gs/lib/board.sh
# src: SRC raspberrypi/linux@rpi-6.12.y bcm2712-rpi-5-b.dts:15 model = "Raspberry Pi 5", read 2026-10-03
DT_MODEL_PREFIX='Raspberry Pi 5'

# network owner: Raspberry Pi OS Bookworm ships NetworkManager (gs-init.sh then builds br0 with nmcli instead of systemd-networkd files)
# src: SRC RPi-Distro/pi-gen@bookworm stage2/02-net-tweaks/00-packages lists "network-manager", read 2026-10-03
NET_BACKEND='networkmanager'
