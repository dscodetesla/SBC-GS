# Raspberry Pi 5 40-pin header (J8): physical pin -> GPIO number of the RP1 chip (pinctrl-rp1, line names GPIO<n>). Same layout as Pi 3B+/4.
# Format: "<physical pin> <GPIO number>" for GPIO pins, "<physical pin> <3V3|5V|GND|ID_SDA|ID_SCL>" for power/ground/ID lines (gpio_find rejects those).
# src: SRC gpiozero/gpiozero@master gpiozero/pins/data.py:499-528 PI4_J8 = (20, 2, { 1: V3_3, 2: V5, 3: PI4_GPIO2, 4: V5, ... 40: PI4_GPIO21 }) and :530 "PI5_J8 = PI4_J8 # This is slightly wrong, but see the PI5_GPIO comment above" (the "wrong" part is the alternate functions, see :389 TODO, not the pin numbers: INF)
# src: SRC raspberrypi/documentation@master computers/raspberry-pi/gpio-on-raspberry-pi.adoc:14 "GPIO pins 0 and 1 are present on the board (physical pins 27 and 28), but are reserved for advanced use", :4 "40-pin GPIO header on all current Raspberry Pi boards"
# src: SRC raspberrypi/linux@rpi-6.12.y bcm2712-rpi-5-b.dts:635-662 RP1 lines "ID_SDA" (GPIO0), "ID_SCL" (GPIO1), "GPIO2" ... "GPIO27": pins 27/28 are labelled here, NOT mapped to 0/1, because no line named GPIO0/GPIO1 exists (rpi4 pinmap.conf maps them to 0/1: gpio_find 27 gives GPIO0, which does not exist)
# src: SRC same adoc "SPI0: ... CE1 (GPIO7)", "Hardware PWM available on GPIO12, GPIO13, GPIO18, GPIO19" (cross-check of pins 26, 32, 33, 12, 35)
