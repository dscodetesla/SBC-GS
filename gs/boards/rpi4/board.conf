# Board profile: Raspberry Pi 4 Model B (BCM2711) on Raspberry Pi OS Bookworm 64-bit. DRAFT (milestone M6 step 1).
# Shell-sourceable KEY=value, no commands. Nothing sources this file for Pi yet; no image was built, nothing ran on hardware.
# Every key carries an evidence comment: "# src:" (what was read, quoted) and, where the value is not proven, "# UNVERIFIED (reason)".
# Evidence tags: SRC = read from the primary source (fetched this session), REPO = file:line in this repo, INF = inference, HW = needs hardware.
# Fetched with curl through the session proxy. docs = raspberrypi/documentation@master documentation/asciidoc/computers,
# linux = raspberrypi/linux@rpi-6.12.y, firmware = raspberrypi/firmware@master, pi-gen = RPi-Distro/pi-gen@master.
# raspberrypi.com/documentation (HTML) returns 403 through the proxy, so the .adoc sources on raw.githubusercontent.com were used instead.
# Docs: docs/BOARD-RPI4.md (key table, UNVERIFIED list, contract-change proposals).

# src: REPO gs/boards/REQUIRED_KEYS:2 (BOARD_ID is the directory name)
BOARD_ID='rpi4'

# GPIO line lookup name prefix, used as: gpiofind ${GPIO_PIN_PREFIX}<n>
# src: SRC linux bcm2711-rpi-4-b.dts:91-93 gpio-line-names = "ID_SDA", "ID_SCL", "GPIO2", "GPIO3", ... (line names are GPIO<BCM number>, there are no PIN_<n> names)
# src: SRC firmware boot/overlays/README "GPIO numbering uses the hardware pin numbering scheme (aka BCM scheme) and not the physical pin numbers."
# src: SRC libgpiod v1.6.x tools/gpiofind.c "Find a GPIO line by name." + lib/ctxless.c gpiod_ctxless_find_line() -> gpiod_line_find(name) (matches line NAMES only)
# src: REPO docs/PI-PORT.md:36 "gpiofind PIN_<n> (libgpiod v1, фізичні номери)" (Radxa contract: gpiofind PIN_<n> with physical header pin numbers; button.sh:51 gpio_find "${!pin}")
# UNVERIFIED (contract mismatch: Radxa <n> is a physical header pin, Pi GPIO<n> is a BCM number; gs.conf pin values such as btn_q1_pin='32' would address the wrong lines until the contract gains a numbering mode, see docs/BOARD-RPI4.md section 4)
GPIO_PIN_PREFIX='GPIO'

# USB OTG controller. 'none' = this profile has no runtime host/device role switch (sentinel, see gs/lib/otg.sh otg_supported)
# src: SRC linux drivers/usb/dwc2/debugfs.c:783-785 creates only "params", "hw_params", "dr_mode" (0444, read-only) and no writable "mode"
# src: SRC linux drivers/usb/dwc3/debugfs.c:1029 debugfs_create_file("mode", 0644, ...) exists only in dwc3 (the Radxa role switch, fcc00000.dwc3)
# src: SRC linux bcm2711.dtsi:1181 "&usb {" and bcm283x.dtsi:491 "usb: usb@7e980000 { compatible = "brcm,bcm2835-usb";" (the single dwc2 OTG controller)
# src: SRC firmware boot/overlays/README "Name:   dwc2 ... Params: dr_mode  Dual role mode: "host", "peripheral" or "otg"" (static choice at boot via dtoverlay=dwc2)
# src: REPO docs/ROADMAP-EXECUTION.md:85 "Pi 4 USB-C лише живлення/пристрій без перемикання хост" (INF there; whether USB-C carries data to dwc2 is HW)
OTG_CONTROLLER='none'
# src: same as OTG_CONTROLLER (no debugfs mode file on dwc2); gs/button.sh change_otg_mode and gs/otg-gadget.sh must be skipped when OTG_CONTROLLER is 'none'
OTG_MODE_FILE='none'

# Directory of device tree overlay files. On Pi they are only AVAILABLE here; they are enabled by a dtoverlay= line in config.txt, not by renaming files
# src: SRC docs config_txt/what_is_config_txt.adoc:3 "Raspberry Pi OS looks for this file in the *boot partition*, located at `/boot/firmware/`."
# src: SRC firmware boot/overlays/README:4 "This directory contains Device Tree overlays." (the boot partition carries the overlays/ directory)
# src: SRC firmware boot/overlays/README "Load:   dtoverlay=dwc2,<param>=<val>" (activation is a config.txt line)
# src: INF the on-disk name overlays/ under /boot/firmware is inferred from the firmware repo layout boot/overlays/, no listing of a Pi OS image was read
DTBO_DIR='/boot/firmware/overlays'
# Radxa overlay files are named <soc>-<name>.dtbo (rk3568-...). Pi overlays have no SoC prefix; 'none' = sentinel
# src: SRC firmware boot/overlays/README "dtoverlay=i2c-rtc", "dtoverlay=pwm", "dtoverlay=dwc2" (names without a SoC prefix)
# src: REPO gs/gs-applyconf.sh:65,92 (Radxa: ls /boot/dtbo/rk3568-*.dtbo and mv of .dtbo.disabled; needs the config.txt mechanism instead, see docs/BOARD-RPI4.md section 4)
DTBO_SOC_PREFIX='none'
# Overlay directory as seen from the lower (read-only root) layer during init
# src: REPO gs/gs-init.sh:50 (Radxa: /media/root-ro/boot/dtbo)
# src: SRC pi-gen export-image/prerun.sh:92 "mount -v "$BOOT_DEV" "${ROOTFS_DIR}/boot/firmware" -t vfat" (the FAT boot partition is a separate mount, not part of the root filesystem)
# UNVERIFIED (overlayroot on Pi is untested: the lower-layer path of a separate FAT mount is not known; value is the plain directory)
DTBO_DIR_LOWER='/boot/firmware/overlays'

# Onboard wifi interface name. The profile keeps the Radxa convention (onboard = wifi0) so that wlan0 stays free for the external RTL adapter
# src: REPO gs/98-rename.rules.in:2-4 (rule 1: every wl* -> wlan0; rule 2: the onboard driver -> @WIFI_ONBOARD_IFACE@; gs.sh:92 and button.sh:15 use wifi0)
# src: SRC docs configuration/configuring-networking.adoc:112 "traditional `eth0` and `wlan0` naming schemes ... off by default" (Pi OS default name of the onboard wifi is wlan0)
# src: INF choosing wifi0 on Pi is a design decision for parity with scripts; that udev renames the onboard device is HW
WIFI_ONBOARD_IFACE='wifi0'
# Kernel driver of the onboard wifi (udev matches ENV{ID_NET_DRIVER})
# src: SRC linux bcm283x-rpi-wifi-bt.dtsi:20-23 "brcmf: wifi@1 { ... compatible = "brcm,bcm4329-fmac";"
# src: SRC linux drivers/net/wireless/broadcom/brcm80211/brcmfmac/of.c:116 of_device_is_compatible(np, "brcm,bcm4329-fmac") (driver dir brcmfmac)
# src: INF the udev property ID_NET_DRIVER=brcmfmac at ACTION==add is not observed (HW)
WIFI_ONBOARD_DRIVER='brcmfmac'

# Interface name of the USB gadget NIC (udev renames KERNELS=="gadget" to it). Unused while OTG_CONTROLLER is 'none'
# src: REPO gs/98-rename.rules.in:7 (Radxa: radxa0)
# UNVERIFIED (placeholder: this profile has no gadget NIC; the name rpi0 was chosen, not read from anywhere)
GADGET_IFNAME='rpi0'

# Home directory of the default user (ruby runtime). The image builder creates the user, so this is a build decision
# src: SRC pi-gen README.md:175 "`FIRST_USER_NAME` (Default: `pi`)"
# src: REPO gs/gs.sh:57 (Radxa: /home/radxa); INF /home/pi follows the pi-gen default, the real user is chosen by the future image build
HOME_DIR='/home/pi'

# Serial console of the board (gs-init.sh writes the welcome banner to it)
# src: SRC docs configuration/interfaces.adoc:304-306 "`/dev/serial0` | Symbolic link | Primary UART: Depending on model, points to `/dev/ttyS0`, `/dev/ttyAMA0`, or `/dev/ttyAMA10`"
# src: SRC docs configuration/interfaces.adoc:272-274 "Raspberry Pi 3 and 4 | `UART1` | `UART0`" (primary = mini UART1 = ttyS0; UART0 is Bluetooth)
# src: SRC docs configuration/interfaces.adoc:356 "If the primary interface is the more sensitive mini UART, the system defaults to 'off' unless explicitly overridden" (needs enable_uart=1)
# src: REPO gs/gs-init.sh:10 (Radxa: tee /dev/ttyFIQ0 /dev/tty1)
# UNVERIFIED (HW: /dev/serial0 exists on Pi 4 only with enable_uart=1 in config.txt, which no image sets yet; gs-init.sh runs under set -e, tee to a missing node would fail)
CONSOLE_TTY='/dev/serial0'

# PWM fan: sysfs path pattern (chip number comes from gs.conf fan_pwm_chip). Needs dtoverlay=pwm on Pi
# src: SRC linux Documentation/ABI/testing/sysfs-class-pwm "What:		/sys/class/pwm/pwmchip<N>/"
# src: SRC firmware boot/overlays/README "Name:   pwm ... Load:   dtoverlay=pwm,<param>=<val>" and "PWM0: 12,4(Alt0) 18,2(Alt5) ..." (pins 12/13/18/19 on the header)
# src: REPO gs/fan.sh:5 (hw_pwm_base + fan_pwm_chip)
PWM_SYSFS_BASE='/sys/class/pwm/pwmchip'

# Disk layout. Pi OS images use an MBR (msdos) table, not GPT, so there is no p3/p4/p5 GPT scheme
# src: SRC pi-gen export-image/prerun.sh:31,49-50 "parted --script "${IMG_FILE}" mklabel msdos" + "BOOT_DEV="${LOOP_DEV}p1"" + "ROOT_DEV="${LOOP_DEV}p2""
# src: SRC docs configuration/boot-behaviour.adoc:186 "`root=/dev/mmcblk0p2` means multimedia card block-device 0, partition 2" (mmcblk + p + N)
PART_SEP='p'
# Overlay (overlayroot upper) partition number. MBR allows 4 primaries: p1 boot, p2 root, p3 overlay, p4 extended container
# src: REPO docs/PI-PORT.md:34 "Pi OS — MBR (`p1` boot, `p2` root)" and docs/ROADMAP-EXECUTION.md:80 "MBR має лише 4 первинні, потрібен логічний розділ або монтування за міткою"
# UNVERIFIED (design for the M6 spike: no image with this layout was built, overlayroot on Pi OS is untested)
PART_OVERLAY_NUM='3'
# Recording partition number: first logical partition inside the extended p4 (Linux numbers logical partitions from 5)
# src: REPO gs/gs-init.sh:26,31,34 (Radxa: p5 videos, exfat); INF logical numbering starts at 5 (MBR rule), not read from a source this session
# UNVERIFIED (design for the M6 spike: gs-init.sh parted mkpart videos has no logical/extended handling, untested)
PART_VIDEOS_NUM='5'
# src: REPO gs/gs-init.sh:36-37 (mkfs.exfat -L videos)
PART_VIDEOS_LABEL='videos'
# Root device is found by the filesystem label "rootfs"
# src: SRC pi-gen export-image/prerun.sh:87 "mke2fs -q -t ext4 -L rootfs -O "$ROOT_FEATURES" -d "${STAGING}" "$ROOT_DEV""
# src: SRC pi-gen export-image/prerun.sh:76 "mkdosfs -n bootfs" (boot partition label is bootfs)
ROOTFS_LABEL='rootfs'

# Mass-storage backing device for the OTG gadget. 'none' = no gadget on this profile (sentinel)
# src: same as OTG_CONTROLLER; REPO gs/otg-gadget.sh:41-42 (Radxa: /dev/mmcblk0p4, /dev/mmcblk1p4)
OTG_MASS_STORAGE_DEFAULT='none'
# src: same as OTG_MASS_STORAGE_DEFAULT (REPO gs/otg-gadget.sh:41-42, Radxa: /dev/mmcblk1p4)
OTG_MASS_STORAGE_ALT='none'

# CPU temperature file (millidegrees), read by the fan controller and the OLED status screen
# src: SRC linux Documentation/driver-api/thermal/sysfs-api.rst:284 "/sys/class/thermal/thermal_zone[0-*]:" (path format)
# src: SRC linux bcm2711.dtsi:73-74,635-638 "thermal: thermal { compatible = "brcm,bcm2711-thermal";" and "&cpu_thermal { ... thermal-sensors = <&thermal>;"
# UNVERIFIED (HW: the zone index 0 is not read from a source; check `cat /sys/class/thermal/thermal_zone*/type`)
THERMAL_CPU_TEMP_FILE='/sys/class/thermal/thermal_zone0/temp'

# I2C bus number of the external DS3231 RTC (optional key). On Pi: dtparam=i2c_arm=on or dtoverlay=i2c-rtc,ds3231 on GPIO2/3 (header pins 3/5)
# src: SRC firmware boot/overlays/README "Name:   i2c-rtc ... dtoverlay=i2c-rtc,<param>=<val> ... ds3231  Select the DS3231 device"
# src: SRC firmware boot/overlays/README "i2c_arm  Set to "on" to enable the ARM's i2c interface"; linux bcm2711.dtsi:1132 "&i2c1 {"
# src: SRC linux bcm2711-rpi.dtsi:13-19 (aliases list has no i2c entry, so the /dev/i2c-N number is assigned dynamically)
# UNVERIFIED (HW: /dev/i2c-1 for the ARM i2c1 is the common name but the number is not read from a source; check `ls /dev/i2c-*`)
RTC_I2C_BUS='1'

# Pi-specific optional keys (not in the Radxa profile; nothing reads them yet)
# src: SRC docs config_txt/what_is_config_txt.adoc:3 "boot partition, located at `/boot/firmware/`"
BOOT_FIRMWARE_DIR='/boot/firmware'
# src: SRC docs config_txt/what_is_config_txt.adoc:3 "Instead of the BIOS ... Raspberry Pi devices use a configuration file called `config.txt`."
CONFIG_TXT='/boot/firmware/config.txt'
# src: SRC docs config_txt/boot.adoc:18 "`cmdline` is the alternative filename on the boot partition from which to read the kernel command line string; the default value is `cmdline.txt`."
CMDLINE_TXT='/boot/firmware/cmdline.txt'
