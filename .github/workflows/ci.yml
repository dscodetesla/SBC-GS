name: CI

on:
  pull_request:
    paths: ['bench/**', 'gs/**', 'build/**', 'tests/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['bench/**', 'gs/**', 'build/**', 'tests/**', '.github/workflows/ci.yml']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck bench (blocking)
        working-directory: bench
        run: shellcheck -x -S warning *.sh
      - name: py_compile
        run: python3 -m py_compile bench/*.py gs/*.py tests/sim/*.py
      - name: shellcheck ratchet for gs/ and build/ (no new findings allowed)
        run: tests/shellcheck-ratchet.sh
      - name: shellcheck the test harness
        run: shellcheck -x -S warning tests/*.sh tests/lib/*.sh tests/static/*.sh tests/sim/*.sh tests/sim/dkms/*.sh tests/sim/netfetch/*.sh tests/sim/models/*.sh tests/sim/models/validate/*.sh tests/sim/fuzz/*.sh tests/sim/twin/*.sh tests/sim/virt/*.sh tests/sim/virt/guest/*.sh build/lib/*.sh

  golden:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Golden-output regression tests for gs/*.sh (no hardware)
        run: tests/run.sh

  loopback:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-x
      - name: Python venv with pinned pymavlink
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r bench/requirements.txt
      - name: Loopback self test (no radio, no hardware)
        run: PY="$PWD/.venv/bin/python" bench/loopback-test.sh
      - name: TX12 RC bridge safety test (no radio, no hardware; python-evdev not needed)
        run: PY="$PWD/.venv/bin/python" timeout 180 bench/tx12-bridge-test.sh

  sim-smoke:
    # No hardware, no root: static checks, ArduPilot-failsafe model, MAVLink + RC bridge dead-man, video RTP + latency,
    # gs-mavlink.sh against a real mavp2p. Strict: a missing tool is a failure. ~15 s of test time. See docs/TESTABILITY.md.
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-x \
            python3-gi gir1.2-gstreamer-1.0 udev systemd
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Router binary (pinned tag, built from the Go module proxy)
        run: GOBIN="$PWD/.bin" go install github.com/bluenviron/mavp2p@v1.3.3
      - name: Python venv with pinned pymavlink
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r bench/requirements.txt
      - name: Smoke test
        run: PATH="$PWD/.bin:$PATH" PY="$PWD/.venv/bin/python" SMOKE_STRICT=1 SMOKE_ONLY="static model mavlink video router" tests/sim/smoke.sh

  sim-layers:
    # Offline --check of every simulation layer (models, validate, twin, fuzz, bio, dkms): ~40 s, stdlib + pymavlink.
    # Blocking: green on a real runner twice in a row (3c7cd89, 9872efd). See docs/SIM-SCENARIOS.md.
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Python venv with pinned pymavlink
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r bench/requirements.txt
      - name: Simulation layers
        run: PY="$PWD/.venv/bin/python" tests/sim/layers.sh
